<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talentra Tz - Recruitment Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'https://esm.sh/react@19.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@19.2.0/client';
        
        function App() {
            return React.createElement('div', { className: "min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100" },
                React.createElement('div', { className: "container mx-auto px-4 py-16" },
                    React.createElement('div', { className: "text-center" },
                        React.createElement('h1', { className: "text-5xl font-bold text-gray-900 mb-4" }, "Talentra Tz"),
                        React.createElement('p', { className: "text-xl text-gray-600 mb-8" }, "Connecting Talent with Opportunity in Tanzania"),
                        React.createElement('div', { className: "flex justify-center gap-4" },
                            React.createElement('a', { href: "/jobs", className: "bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition" }, "Find Jobs"),
                            React.createElement('a', { href: "/post-job", className: "bg-green-600 text-white px-8 py-3 rounded-lg hover:bg-green-700 transition" }, "Post a Job")
                        )
                    )
                )
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
